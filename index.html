<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>My Accessible Photo Gallery</title>
	<link rel="stylesheet" href="css/gallery.css">
	<script src="js/gallery.js"></script>
</head>
<body onload="addTabFocus()">

	<div id="image">
		Hover over an image below to display here.
	</div>

	<img class="preview" alt="Description of photo 1" src="images/photo1.jpg"
		onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">

	<img class="preview" alt="Description of photo 2" src="images/photo2.jpg"
		onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">

	<img class="preview" alt="Description of photo 3" src="images/photo3.jpg"
		onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">

	<img class="preview" alt="Description of photo 4" src="images/photo4.jpg"
		onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">

	<img class="preview" alt="Description of photo 5" src="images/photo5.jpg"
		onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">

	<img class="preview" alt="Description of photo 6" src="images/photo6.jpg"
		onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">

</body>
</html>
